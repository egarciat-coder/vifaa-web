# Configuración de e-stack para este repo (leída por estack-git y .githooks/pre-push).
# Ver workflows/CHANGES.md del e-stack.
# Sin ambiente QA: main es integración y producción a la vez. Cada integración despliega producción y
# exige confirmación explícita del usuario (integrate publish --prod-confirmed / ESTACK_PROD_CONFIRMED=1).
[estack]
	integration = main
	production = main
	# Verificado 2026-10-20 (deployments de GitHub/Railway, servicio celebrated-vision): todos los deploys salieron de main.
	deploy-branches = main
